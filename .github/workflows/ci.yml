name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {julia-version: '1.6', os: ubuntu-latest}
          # Julia 1.6 has no macOS ARM binary; macos-latest is ARM.
          - {julia-version: '1.6', os: macos-15-intel}
          - {julia-version: '1.10', os: ubuntu-latest}
          - {julia-version: '1.10', os: macos-latest}
          - {julia-version: '1', os: ubuntu-latest}
          - {julia-version: '1', os: macos-latest}
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  extensions:
    name: Model extensions / Julia stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Test weak-dependency adapters
        run: |
          julia -e 'using Pkg; Pkg.activate(temp=true); Pkg.develop(path="."); Pkg.add(["DataFrames", "GLM", "FixedEffectModels"]); include("test/extension_tests.jl")'
