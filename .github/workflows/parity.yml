name: Cross-language parity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select panelcert ref
        id: sibling-ref
        shell: bash
        env:
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads \
            https://github.com/profsms/panelcert.git \
            "refs/heads/${CANDIDATE_REF}" >/dev/null 2>&1; then
            echo "ref=${CANDIDATE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: profsms/panelcert
          path: panelcert
          ref: ${{ steps.sibling-ref.outputs.ref }}
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install packages
        run: |
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
          R CMD INSTALL panelcert
      - name: Emit and compare
        run: |
          julia --project=. parity/julia_emit.jl parity/julia.json parity/julia_packing.json
          Rscript parity/r_emit.R parity/r.json parity/r_packing.json
          python parity/compare.py parity/julia.json parity/r.json parity/julia_packing.json parity/r_packing.json
